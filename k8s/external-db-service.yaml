# This is how Kubernetes reaches a database that lives OUTSIDE the cluster.
#
# A Service with no "selector" does not auto-discover pods.
# Instead, we pair it with a hand-written Endpoints object that lists
# the real IP of the external database host.
#
# Result: inside the cluster, "external-db.three-tier.svc.cluster.local:5432"
# resolves to the external Postgres server — same DNS pattern as any other Service.
#
# DB_PORT in .env.example defaults to 5433 to avoid collision with any host
# Postgres instance. Update the port below if you change DB_PORT.
apiVersion: v1
kind: Service
metadata:
  name: external-db
  namespace: three-tier
spec:
  ports:
    - port: 5432
      targetPort: 5433
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-db
  namespace: three-tier
subsets:
  - addresses:
      - ip: <your-vm-ip>   # VM host IP — must match GITLAB_HOST in .env
    ports:
      - port: 5433         # must match DB_PORT in .env (default 5433)
