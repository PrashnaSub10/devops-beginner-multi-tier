# This is how Kubernetes reaches a database that lives OUTSIDE the cluster.
#
# A Service with no "selector" does not auto-discover pods.
# Instead, we pair it with a hand-written Endpoints object that lists
# the real IP of the external database host.
#
# Result: inside the cluster, "external-db.three-tier.svc.cluster.local:5432"
# resolves to the external Postgres server — same DNS pattern as any other Service.
apiVersion: v1
kind: Service
metadata:
  name: external-db
  namespace: three-tier
spec:
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-db
  namespace: three-tier
subsets:
  - addresses:
      - ip: 172.16.10.214   # VM host IP — Postgres exposed via docker-compose ports
    ports:
      - port: 5432
