# ─────────────────────────────────────────────────────────────────────────────
# 3-Tier DevOps Demo  (Docker Compose version — mirrors the K3s layout in k8s/)
#
# Tier 1 — Presentation : frontend  (Nginx, port 8080 on host)
# Tier 2 — Logic        : backend   (Flask, 2 replicas via --scale)
# Tier 3 — Data         : db        (Postgres, private network only)
#
# Networks:
#   public_net  — host ↔ frontend only
#   app_net     — frontend ↔ backend ↔ db  (internal, not reachable from host)
#   gitlab_net  — gitlab ↔ gitlab-runner   (isolated from the 3-tier app)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Tier 1: Presentation ──────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "${LB_PORT:-8080}:80"   # only this service is reachable from the host
    networks:
      - public_net
      - app_net
    depends_on:
      - backend-service

  # ── Tier 2: Logic ─────────────────────────────────────────────────────────
  # Run multiple replicas with:  docker compose up --scale backend-service=2
  # The service name "backend-service" is what nginx.conf proxies to.
  backend-service:
    build: ./backend
    environment:
      APP_NAME: backend
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-appdb}
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-secretpassword}
    expose:
      - "8080"
    networks:
      - app_net
    depends_on:
      - db

  # ── Tier 3: Data ──────────────────────────────────────────────────────────
  # No ports exposed to host — only reachable from app_net.
  db:
    build: ./db
    environment:
      POSTGRES_DB: ${DB_NAME:-appdb}
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_net

  # ── GitLab CE ─────────────────────────────────────────────────────────────
  # Runs on its own network — completely isolated from the 3-tier app.
  # Access: http://localhost:8929  (root / Password1234! on first boot)
  # SSH clone: ssh://git@localhost:2222
  # First startup takes ~3 minutes for GitLab to fully initialise.
  gitlab:
    image: gitlab/gitlab-ce:17.11.1-ce.0
    container_name: gitlab
    hostname: localhost
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:${GITLAB_PORT:-8929}'
        gitlab_rails['initial_root_password'] = '${GITLAB_ROOT_PASSWORD:-Password1234!}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2224}
        prometheus_monitoring['enable'] = false
    ports:
      - "${GITLAB_PORT:-8929}:${GITLAB_PORT:-8929}"
      - "${GITLAB_SSH_PORT:-2224}:22"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    networks:
      - gitlab_net
    shm_size: "256m"

  # ── GitLab Runner ─────────────────────────────────────────────────────────
  # Executes the .gitlab-ci.yml pipeline jobs.
  # Needs docker socket so it can run docker:26-dind builds.
  gitlab-runner:
    image: gitlab/gitlab-runner:v17.11.1
    container_name: gitlab-runner
    restart: unless-stopped
    volumes:
      - gitlab_runner_config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gitlab_net
    depends_on:
      - gitlab

networks:
  public_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.11.0.0/24

  # internal: true means Docker will not add a default gateway route,
  # so containers on this network cannot reach the internet directly.
  app_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.21.0.0/24

  gitlab_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.31.0.0/24

volumes:
  db_data:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  gitlab_runner_config:
